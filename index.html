```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="header">
    <div class="logo">Movie<span>Hub</span></div>

    <div class="search">
        <input id="searchInput" type="text" placeholder="Search movies and TV shows...">
        <button id="searchBtn">Search</button>
    </div>
</header>

<main>
    <section id="hero" class="hero"></section>

    <section class="section">
        <div class="section-title">
            <h2>Trending Now</h2>
        </div>
        <div id="trending" class="movie-grid"></div>
    </section>

    <section id="searchSection" class="section hidden">
        <div class="section-title">
            <h2>Search Results</h2>
        </div>
        <div id="searchResults" class="movie-grid"></div>
    </section>

    <section class="section">
        <div class="section-title">
            <h2>Latest Movies</h2>
        </div>
        <div id="movies" class="movie-grid"></div>
    </section>
</main>

<!-- Details modal -->
<div id="detailsModal" class="modal hidden">
    <div class="modal-content">
        <button class="close" onclick="closeDetails()">×</button>

        <img id="detailPoster" class="detail-poster" src="" alt="">

        <div class="detail-info">
            <h2 id="detailTitle"></h2>
            <p id="detailDescription"></p>

            <div class="selectors">
                <label>
                    Language
                    <select id="languageSelect"></select>
                </label>

                <label>
                    Quality
                    <select id="qualitySelect"></select>
                </label>
            </div>

            <div class="player-wrapper">
                <video id="videoPlayer" controls playsinline>
                    Your browser does not support video playback.
                </video>
            </div>

            <div class="actions">
                <button id="playButton" class="primary">▶ Play</button>
                <a id="downloadButton" class="download" href="#" download>
                    ↓ Download
                </a>
            </div>
        </div>
    </div>
</div>

<div id="loading" class="loading hidden">Loading...</div>
<div id="error" class="error hidden"></div>

<script src="script.js"></script>
</body>
</html>
```
