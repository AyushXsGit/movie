<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Movie<span>Hub</span>
    </div>

    <div class="search-area">

        <input
            id="searchInput"
            type="search"
            placeholder="Search movies..."
            autocomplete="off"
        >

        <button id="searchButton">
            Search
        </button>

        <div id="suggestions"></div>

    </div>

</header>


<main>

    <!-- HOME -->

    <section id="homeSection">

        <div class="section-header">
            <h2>Featured</h2>
        </div>

        <div id="featuredGrid" class="movie-grid"></div>


        <div class="section-header">
            <h2>All Movies</h2>
        </div>

        <div id="homeGrid" class="movie-grid"></div>

    </section>


    <!-- SEARCH -->

    <section id="searchSection" class="hidden">

        <div class="section-header">
            <h2 id="searchHeading">
                Search Results
            </h2>
        </div>

        <div id="searchGrid" class="movie-grid"></div>

    </section>

</main>


<!-- DETAILS -->

<div id="detailModal" class="modal hidden">

    <div class="modal-content">

        <button
            id="closeModal"
            class="close-button"
        >
            ×
        </button>


        <div class="detail-layout">

            <img
                id="detailPoster"
                class="detail-poster"
                src=""
                alt=""
            >


            <div class="detail-information">

                <h1 id="detailTitle">
                    Loading...
                </h1>


                <div
                    id="detailMeta"
                    class="detail-meta"
                ></div>


                <p
                    id="detailDescription"
                    class="description"
                ></p>


                <!-- LANGUAGE -->

                <div id="languageSection"></div>


                <!-- SEASON -->

                <div id="seasonSection"></div>


                <!-- EPISODE -->

                <div id="episodeSection"></div>


                <!-- QUALITY -->

                <div id="qualitySection"></div>


                <!-- PLAYER -->

                <div
                    id="playerBox"
                    class="player-box"
                >

                    <div class="player-placeholder">

                        <div class="big-play">
                            ▶
                        </div>

                        <h3>
                            Select an episode
                        </h3>

                        <p>
                            The video player will appear here.
                        </p>

                    </div>

                </div>


                <!-- DOWNLOAD -->

                <div
                    id="downloadBox"
                    class="download-box"
                ></div>

            </div>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
